name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The default shallow checkout is enough: both scripts read the working tree only, and
      # nothing here inspects git history or tags.
      - uses: actions/checkout@v4
      # Run the floor CONTRIBUTING promises ("Node 18+"), not the newest release: CI's job here is to
      # catch a script that quietly depends on a newer API than contributors are told they need. Bump
      # both together or neither.
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      # No install step: package.json is scripts-only, with zero dependencies.
      - run: npm test
